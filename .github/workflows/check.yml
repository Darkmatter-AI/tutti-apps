name: Check

# Read-only and without secrets, because anyone can open a pull request. Never
# change this to pull_request_target.
on:
  pull_request:
  # A pull request an agent opens starts no checks by itself, so it asks for them
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scripts come from main, so a change can't weaken its own checks. This
      # job runs none of the change's code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: .main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Read the app files
        run: node .main/scripts/check-files.mjs --root .
      - name: Read what their servers say
        run: node .main/scripts/check-servers.mjs --root . --base .main

  # On its own machine, because this does run the change's code
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test "scripts/*.test.mjs"
