name: Tests

# Runs the change's own code, so it holds nothing worth taking: no secrets, and a
# token that can only read. The check that decides what an app file may say is in
# check.yml, where a change can't edit it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test "scripts/*.test.mjs"
