name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      accept:
        description: Accept one app's changed server or doubt, by its key, after looking at it
        type: string
        required: false
      review_max:
        description: How many apps the second agent reads
        type: number
        default: 5
      draft_max:
        description: How many apps the drafting agent looks for
        type: number
        default: 1

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The AI key lives here, and only main can run in it
    environment: agents
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proof
          path: .proof
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Read every app's server
        id: check
        continue-on-error: true
        env:
          ACCEPT: ${{ inputs.accept }}
        run: node scripts/nightly.mjs --proof .proof

      # The AI key is only ever on these two steps
      - name: Second agent
        id: review
        continue-on-error: true
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          REVIEW_MAX: ${{ inputs.review_max }}
        run: node scripts/review.mjs --proof .proof --max "${REVIEW_MAX:-5}"

      - name: Drafting agent
        id: draft
        continue-on-error: true
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          DRAFT_MAX: ${{ inputs.draft_max }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/draft.mjs --proof .proof --max "${DRAFT_MAX:-1}"

      - name: Write where everything stands
        if: always()
        env:
          STEP_CHECK: ${{ steps.check.outcome }}
          STEP_REVIEW: ${{ steps.review.outcome }}
          STEP_DRAFT: ${{ steps.draft.outcome }}
        run: node scripts/finish.mjs --proof .proof

      # The token to save with only arrives here, after the agents have finished
      - name: Save it
        if: always()
        working-directory: .proof
        env:
          SAVE_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit --quiet -m "Checks for $(date -u +%F)"
          git push --quiet "https://x-access-token:${SAVE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:proof
